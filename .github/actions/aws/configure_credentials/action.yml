name: "Configure AWS Credentials"
description: "Configures AWS credentials by assuming a specified IAM role."
inputs:
  AWS_ROLE_ARN_TO_ASSUME:
    description: "AWS ROLE ARN to assume"
    required: true

  AWS_SESSION_DURATION:
    description: "Duration for the assumed role session in seconds. Defaults to 900 seconds (15 minutes). minimum is 900. Maximum is 3600 seconds (1 hour)."
    required: true
    default: "900"
    type: choice
    options:
      - "900"
      - "1800"
      - "2700"
      - "3600"

  AWS_ACCOUNT_ID_MASKING_ENABLED:
    description: "Whether to mask the AWS Account ID in logs. Defaults to true."
    required: false
    default: "true"
    type: choice
    options:
      - "true"
      - "false"

  AWS_SESSION_NAME:
    description: "Name for the assumed role session. Defaults to 'GitHubActionsSession'."
    required: false
    default: "GitHubActionsSession"

  AWS_REGION:
    description: "in which aws region to assume the role at ? Defaults to eu-central-2 ( Zurich )"
    required: false
    default: "eu-central-2"

  AWS_AUDIENCE:
    description: "Audience for the role assumption. Defaults to 'sts.amazonaws.com'."
    required: false
    default: "sts.amazonaws.com"

  UNSET_CURRENT_CREDENTIALS:
    description: "Whether to unset any previously configured AWS credentials to avoid leakage. Defaults to true."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    # An empty role ARN is not an error to configure-aws-credentials: it falls back to the default
    # credential chain. On a GitHub hosted runner that chain is empty, so the job fails immediately
    # and the cause is obvious. On a self hosted CodeBuild runner the chain finds the runner's own
    # service role, so the job carries on as the wrong identity and fails later on a permission it
    # was never meant to need. Catch it here instead.
    #
    # 'required: true' above does not do this. GitHub treats it as documentation, and a caller that
    # passes an unset secret passes an empty string rather than failing.
    - name: "Check a role ARN was supplied"
      shell: bash
      env:
        ROLE_ARN: ${{ inputs.AWS_ROLE_ARN_TO_ASSUME }}
      run: |
        set -euo pipefail

        if [ -z "${ROLE_ARN}" ]; then
          echo "::error::No AWS role ARN was supplied, so this job would have run as whatever identity the runner already has. Set the secret the calling workflow passes to AWS_ROLE_ARN_TO_ASSUME. A repository that has never published needs it adding: an unset secret arrives here as an empty string, not as an error."
          exit 1
        fi

        # A wrong-shaped value would fail at AssumeRole anyway, but the message there names STS
        # rather than the secret, which sends you looking in the wrong place.
        if ! printf '%s' "${ROLE_ARN}" | grep -qE '^arn:aws[a-z-]*:iam::[0-9]{12}:role/'; then
          echo "::error::AWS_ROLE_ARN_TO_ASSUME is set but is not an IAM role ARN. Expected arn:aws:iam::<account>:role/<name>."
          exit 1
        fi

    - name: "Configure AWS credentials"
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
      with:
        mask-aws-account-id: ${{ inputs.AWS_ACCOUNT_ID_MASKING_ENABLED }} # account id is sensitive but not secret. don't publicly expose it.
        role-to-assume: ${{ inputs.AWS_ROLE_ARN_TO_ASSUME }} # a role that can be assumed by GHA actions only
        role-duration-seconds: ${{ inputs.AWS_SESSION_DURATION }} # minimum is 900 seconds ( 15 minutes )
        role-session-name: ${{ inputs.AWS_SESSION_NAME }} # name of the session for auditing purposes
        aws-region: ${{ inputs.AWS_REGION }} # region where the role is defined
        unset-current-credentials: ${{ inputs.UNSET_CURRENT_CREDENTIALS }} # unset any previously configured credentials to avoid leakage
        audience: ${{ inputs.AWS_AUDIENCE }} # audience for AWS STS


