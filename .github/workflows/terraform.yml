name: TERRAFORM STACK

on:
  workflow_call:
    inputs:
      github_runner:
        description: 'Name of GitHub-hosted runner or self-hosted runner'
        default: 'ubuntu-latest'
        required: false
        type: string
      use_opentofu:
        description: 'Use OpenTofu instead of Terraform'
        default: true
        required: false
        type: boolean
      enable_terraform_docs:
        description: 'Enable terraform-docs to generate documentation'
        default: true
        required: false
        type: boolean
      enable_terraform_fmt:
        description: 'Enable terraform fmt to format code'
        default: true
        required: false
        type: boolean
      enable_terraform_execution:
        description: 'Enable terraform plan on pull requests and apply on push to default branch'
        default: false
        required: false
        type: boolean
      aws_default_region:
        description: 'Default AWS region to use for terraform execution (requires "enable_terraform_execution" to be true)'
        default: 'eu-central-2'
        required: false
        type: string
      aws_oidc_role_arn:
        description: 'AWS OIDC role ARN to assume for terraform execution (requires "enable_terraform_execution" to be true)'
        default: ''
        required: false
        type: string
      terraform_version:
        description: 'Terraform version used in github action'
        required: true
        type: string
      terraform_working_directory:
        description: 'A relative path starting with "." that Terraform will execute within (e.g. "./infrastructure")'
        default: '.'
        required: false
        type: string
      terraform_modules_auth:
        description: 'Authentication method for private modules (none|github-app). If set to "github-app", the secrets "TERRAFORM_MODULES_APP_ID" and "TERRAFORM_MODULES_APP_PRIVATE_KEY" are required.'
        default: 'none'
        required: false
        type: string
      terraform_modules_github_owner:
        description: 'GitHub owner/organization name for private modules (required when terraform_modules_auth is github-app)'
        default: ''
        required: false
        type: string
      terraform_registry_hostname:
        description: 'Hostname of Terraform module registry (public or private). If using a private registry, ensure that the "TERRAFORM_REGISTRY_TOKEN" secret is set.'
        default: 'app.terraform.io'
        required: false
        type: string
      tflint_repo:
        description: 'Public repo where tflint config is stored'
        default: 'nuvibit/github-tflint-config'
        required: false
        type: string
      tflint_repo_config_path:
        description: 'Path to tflint config in tflint_repo'
        default: 'aws/.tflint.hcl'
        required: false
        type: string
      tflint_repo_ref:
        description: 'Ref or branch of tflint_repo'
        default: 'main'
        required: false
        type: string
      tflint_version:
        description: 'Tflint version to use in github action'
        default: 'latest'
        required: false
        type: string
      trivy_version:
        description: 'Trivy version to use in github action'
        default: 'v0.69.3'
        required: false
        type: string
      commit_user:
        description: 'Username which should be used for commits by github action'
        default: 'github-actions'
        required: false
        type: string
      commit_email:
        description: 'Email which should be used for commits by github action'
        default: 'noreply@github.com'
        required: false
        type: string
      concurrency_group:
        description: 'Name of concurrency group to manage concurrent github action runs'
        default: ${{ github.repository }}/${{ github.event.pull_request.head.ref || github.ref }}/${{ inputs.terraform_working_directory }}
        required: false
        type: string
      default_branch:
        description: 'Default branch name for terraform apply (e.g. main, master)'
        default: 'main'
        required: false
        type: string
      aws_oidc_role_duration_seconds:
        description: 'Duration in seconds for assuming the AWS OIDC role (requires "enable"_terraform_execution" to be true)'
        default: 900 # 15 minutes
        required: false
        type: number
      checkov_check:
        description: 'Comma-separated list of Checkov tests to perform'
        default: ''
        required: false
        type: string
      checkov_skip_check:
        description: 'Comma-separated list of Checkov tests to skip'
        default: 'CKV_TF_1,CKV_TF_2'
        required: false
        type: string
      checkov_soft_fail:
        description: 'Report Checkov findings without failing the job. The findings still appear in the annotations and the run summary. Useful while an existing codebase is brought up to the policy set, so the scan is visible before it is enforced.'
        default: false
        required: false
        type: boolean
      checkov_enabled:
        description: 'Enable or disable Checkov scan'
        default: 'true'
        required: false
        type: string
      checkov_log_level:
        description: 'Log level for Checkov scan (CRITICAL, ERROR, WARNING, INFO, DEBUG)'
        default: 'WARNING'
        required: false
        type: string
      enable_ecr_oci_modules:
        description: 'Enable ECR authentication for OCI modules. Set to true if using OCI modules from ECR'
        default: false
        required: false
        type: boolean
      ecr_oci_registry_ids:
        description: 'Comma-separated list of ECR registry IDs to authenticate with (e.g., "031244176730,123456789012")'
        default: ''
        required: false
        type: string
    secrets:
      # GitHub App credentials to use instead of default GITHUB_TOKEN to avoid not triggering workflow runs on commit
      GH_APP_ID:
        required: false
      GH_APP_PRIVATE_KEY:
        required: false
      # (optional) GitHub App credentials for accessing private Terraform modules (requires 'terraform_modules_auth' to be set to "github-app" and 'terraform_modules_github_owner' to be set)
      TERRAFORM_MODULES_APP_ID:
        required: false
      TERRAFORM_MODULES_APP_PRIVATE_KEY:
        required: false
      # (optional) Token for accessing private Terraform module registry (requires 'terraform_registry_hostname' to be set to a private registry)
      TERRAFORM_REGISTRY_TOKEN:
        required: false

# Ensures that only one workflow runs at a time
concurrency: ${{ inputs.concurrency_group }}

jobs:
  terraform-fmt:
    if : ${{ inputs.enable_terraform_fmt }}
    runs-on: ${{ inputs.github_runner }}
    outputs:
      fmt_status: ${{ steps.fmt.outcome }}
      diff_exists: ${{ steps.fmt_commit.outputs.diff }}

    env:
      # the secrets context cannot be read from a step level if, so it is surfaced
      # here as a plain value that a step condition can test
      GH_APP_CONFIGURED: ${{ secrets.GH_APP_ID != '' && secrets.GH_APP_PRIVATE_KEY != '' }}
    steps:
      # Skipped rather than allowed to fail when no app is configured. continue-on-error
      # stops the failure but not the error annotation, so every run of a repository that
      # does not use private modules showed red errors on an otherwise green result, which
      # teaches people to ignore annotations.
      - name: Get Github Access Token
        id: github_app_token
        if: env.GH_APP_CONFIGURED == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # if owner and repositories are empty, access will be scoped to only the current repository
          # owner: ''
          # repositories: ''

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          # Fallback to GITHUB_TOKEN if App token not generated
          token: ${{ steps.github_app_token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Setup Terraform
        if: ${{ inputs.use_opentofu == false }}
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Setup OpenTofu
        if: ${{ inputs.use_opentofu == true }}
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: ${{ inputs.terraform_version }}
          tofu_wrapper: false

      - name: Terraform Format
        id: fmt
        run: |
          if [[ "${{ inputs.use_opentofu }}" == "true" ]]; then
            tofu fmt -recursive
          else
            terraform fmt -recursive
          fi
        working-directory: ${{ inputs.terraform_working_directory }}

      - name: Commit files
        id: fmt_commit
        run: |
          git config --local user.name "${{ inputs.commit_user }}"
          git config --local user.email "${{ inputs.commit_email }}"
          if [[ -z $(git status -s) ]]; then
            echo "diff=false" >> $GITHUB_OUTPUT
          else
            echo "diff=true" >> $GITHUB_OUTPUT
          fi
          git diff-index --quiet HEAD || git commit -m "style(terraform fmt): format code" -a

      # Plain git rather than a third-party action. This step pushes commits to the
      # caller's repository, which makes it the most privileged external dependency in the
      # pipeline, and it does no more than one push command.
      - name: Push changes
        if: steps.fmt_commit.outputs.diff == 'true'
        env:
          # the app token when one was minted, otherwise the job's own token
          TOKEN: ${{ steps.github_app_token.outputs.token || secrets.GITHUB_TOKEN }}
          # head.ref on a pull request, ref_name on a push; both are bare branch names
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}"

  terraform-docs:
    needs:
      - terraform-fmt
    if: ${{ inputs.enable_terraform_docs && (needs.terraform-fmt.result == 'skipped' || needs.terraform-fmt.outputs.diff_exists == 'false') }}
    runs-on: ${{ inputs.github_runner }}
    outputs:
      docs_status: ${{ steps.docs.outcome }}
      diff_exists: ${{ steps.docs.outputs.num_changed > 0 }}

    env:
      # the secrets context cannot be read from a step level if, so it is surfaced
      # here as a plain value that a step condition can test
      GH_APP_CONFIGURED: ${{ secrets.GH_APP_ID != '' && secrets.GH_APP_PRIVATE_KEY != '' }}
    steps:
      # Skipped rather than allowed to fail when no app is configured. continue-on-error
      # stops the failure but not the error annotation, so every run of a repository that
      # does not use private modules showed red errors on an otherwise green result, which
      # teaches people to ignore annotations.
      - name: Get Github Access Token
        id: github_app_token
        if: env.GH_APP_CONFIGURED == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # if owner and repositories are empty, access will be scoped to only the current repository
          # owner: ''
          # repositories: ''

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          # Fallback to GITHUB_TOKEN if App token not generated
          token: ${{ steps.github_app_token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Run Terraform Docs
        id: docs
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          working-dir: ${{ inputs.terraform_working_directory }}
          output-file: README.md
          output-method: inject
          output-format: markdown document
          args: --sort-by required --anchor=false
          git-push: true
          git-push-user-name: ${{ inputs.commit_user }}
          git-push-user-email: ${{ inputs.commit_email }}
          git-commit-message: "docs(terraform-docs): update tfdocs"
          # Note: This action (terraform-docs/gh-actions) will automatically use the
          # token from the 'checkout' step for its git operations.

  terraform-lint:
    needs:
      - terraform-fmt
      - terraform-docs
    # this job should only run if there are no new commits caused by terraform-fmt or terraform-docs
    # if terraform-docs is disabled, it should only run if terraform-fmt caused no changes
    # if terraform-fmt is disabled, it should run unconditionally
    if: ${{ always() && !failure() && !cancelled() && (needs.terraform-fmt.result == 'skipped' || needs.terraform-fmt.outputs.diff_exists == 'false') && (!inputs.enable_terraform_docs || needs.terraform-docs.result == 'skipped' || needs.terraform-docs.outputs.diff_exists == 'false') }}
    runs-on: ${{ inputs.github_runner }}
    outputs:
      lint_status: ${{ steps.lint.outcome }}

    env:
      # the secrets context cannot be read from a step level if, so it is surfaced
      # here as a plain value that a step condition can test
      GH_APP_CONFIGURED: ${{ secrets.GH_APP_ID != '' && secrets.GH_APP_PRIVATE_KEY != '' }}
    steps:
      # Skipped rather than allowed to fail when no app is configured. continue-on-error
      # stops the failure but not the error annotation, so every run of a repository that
      # does not use private modules showed red errors on an otherwise green result, which
      # teaches people to ignore annotations.
      - name: Get Github Access Token
        id: github_app_token
        if: env.GH_APP_CONFIGURED == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # if owner and repositories are empty, access will be scoped to only the current repository
          # owner: ''
          # repositories: ''

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          token: ${{ steps.github_app_token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Get TFLint Config
        uses: terraform-linters/tflint-load-config-action@32d9f74138340b95873e956fbdfc390db819bff1 # v3
        if: ${{ inputs.tflint_repo_config_path != '' }}
        with:
          source-repo: ${{ inputs.tflint_repo }}
          source-path: ${{ inputs.tflint_repo_config_path }}
          source-ref: ${{ inputs.tflint_repo_ref }}
          destination-path: .tflint.hcl
          token: ${{ steps.github_app_token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Run TFLint
        uses: reviewdog/action-tflint@54a5e5aed57dcfbb4662ec548de876df33d6288d # v1
        id: lint
        with:
          github_token: ${{ steps.github_app_token.outputs.token || secrets.GITHUB_TOKEN }}
          working_directory: ${{ inputs.terraform_working_directory }}
          tflint_version: ${{ inputs.tflint_version }}
          reporter: github-pr-check
          fail_level: error
          filter_mode: nofilter
          level: error
          flags: ""
          tflint_init: true

  terraform-security:
    needs:
      - terraform-fmt
      - terraform-docs
      - terraform-lint
    # this job should only run if there are no new commits caused by terraform-fmt or terraform-docs
    # if terraform-docs is disabled, it should only run if terraform-fmt caused no changes
    # if terraform-fmt is disabled, it should run unconditionally
    if: ${{ always() && !failure() && !cancelled() && (needs.terraform-fmt.result == 'skipped' || needs.terraform-fmt.outputs.diff_exists == 'false') && (!inputs.enable_terraform_docs || needs.terraform-docs.result == 'skipped' || needs.terraform-docs.outputs.diff_exists == 'false') }}
    runs-on: ${{ inputs.github_runner }}
    outputs:
      security_status: ${{ steps.security.outcome }}

    env:
      # the secrets context cannot be read from a step level if, so it is surfaced
      # here as a plain value that a step condition can test
      GH_APP_CONFIGURED: ${{ secrets.GH_APP_ID != '' && secrets.GH_APP_PRIVATE_KEY != '' }}
    steps:
      # Skipped rather than allowed to fail when no app is configured. continue-on-error
      # stops the failure but not the error annotation, so every run of a repository that
      # does not use private modules showed red errors on an otherwise green result, which
      # teaches people to ignore annotations.
      - name: Get Github Access Token
        id: github_app_token
        if: env.GH_APP_CONFIGURED == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # if owner and repositories are empty, access will be scoped to only the current repository
          # owner: ''
          # repositories: ''

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          token: ${{ steps.github_app_token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Run Trivy
        uses: reviewdog/action-trivy@102f1eda529aaab3502cbef08bbb0050ee0b6b60 # v1
        id: security
        with:
          github_token: ${{ steps.github_app_token.outputs.token || secrets.GITHUB_TOKEN }}
          working_directory: ${{ inputs.terraform_working_directory }}
          reporter: github-pr-check
          fail_level: error
          filter_mode: nofilter
          level: error
          flags: ""
          trivy_flags: ""
          trivy_command: config
          trivy_target: .
          trivy_version: ${{ inputs.trivy_version }}

      - name: Run Checkov
        id: checkov
        if: ${{ inputs.checkov_enabled != 'false' }}
        # pinned to a commit rather than a tag or branch: this is a third-party action
        # running inside the compliance pipeline, and both branches and tags are mutable.
        uses: bridgecrewio/checkov-action@59b9d7edfcad5b87fbe3f473a9a134a721ad03f8 # v12.3119.0
        with:
          check: ${{ inputs.checkov_check }} # optional: run only a specific check_id. can be comma separated list
          skip_check: ${{ inputs.checkov_skip_check }} # optional: skip a specific check_id. can be comma separated list
          quiet: true # optional: display only failed checks
          soft_fail: ${{ inputs.checkov_soft_fail }} # report without failing when true
          framework: terraform # optional: run only on a specific infrastructure {cloudformation,terraform,kubernetes,all}
          download_external_modules: false # optional: download external terraform modules from public git repositories and terraform registry
          log_level: ${{ inputs.checkov_log_level || 'WARNING' }} # optional: set log level {CRITICAL, ERROR, WARNING, INFO, DEBUG}
          directory: ${{ inputs.terraform_working_directory }}

      # Checkov writes SARIF but nothing reads it, and unlike Trivy it produces no
      # reviewdog annotations. With soft fail enabled the job goes green, so without this
      # the findings exist only in the raw log and are effectively invisible, which defeats
      # the point of reporting instead of blocking.
      - name: Checkov findings summary
        if: ${{ always() && inputs.checkov_enabled != 'false' }}
        env:
          SOFT_FAIL: ${{ inputs.checkov_soft_fail }}
        run: |
          set -uo pipefail
          # the action writes results.sarif; the checkov CLI names it results_sarif.sarif
          SARIF=$(find "${GITHUB_WORKSPACE}" -maxdepth 3 -name 'results*.sarif' -print -quit 2>/dev/null)
          if [ -z "${SARIF}" ]; then
            echo "## Checkov" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No SARIF output was produced, so there is nothing to report." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$SARIF" "$SOFT_FAIL" >> "$GITHUB_STEP_SUMMARY" <<'PYEOF'
          import collections, json, os, sys

          sarif, soft = sys.argv[1], sys.argv[2] == "true"
          data = json.load(open(sarif))
          runs = data.get("runs") or [{}]
          results = runs[0].get("results") or []
          rules = {r.get("id"): r for r in (runs[0].get("tool", {}).get("driver", {}).get("rules") or [])}

          print("## Checkov")
          print()
          if not results:
              print("No findings.")
              raise SystemExit

          by_rule = collections.Counter(r.get("ruleId") for r in results)
          print(f"{len(results)} finding(s) across {len(by_rule)} check(s)."
                + (" Reported only, not blocking this run." if soft else ""))
          print()
          print("| Check | Count | Description |")
          print("|---|---:|---|")
          for rule_id, count in by_rule.most_common():
              rule = rules.get(rule_id, {})
              desc = (rule.get("shortDescription", {}) or {}).get("text") or rule.get("name") or ""
              help_uri = rule.get("helpUri")
              label = f"[`{rule_id}`]({help_uri})" if help_uri else f"`{rule_id}`"
              print(f"| {label} | {count} | {desc[:90]} |")

          print()
          print("<details><summary>Where</summary>")
          print()
          for r in results[:60]:
              loc = ((r.get("locations") or [{}])[0].get("physicalLocation") or {})
              uri = (loc.get("artifactLocation") or {}).get("uri", "?")
              line = (loc.get("region") or {}).get("startLine", "?")
              print(f"- `{r.get('ruleId')}` {uri}:{line}")
          if len(results) > 60:
              print(f"- ... and {len(results) - 60} more")
          print()
          print("</details>")
          PYEOF

  terraform-execution:
    needs:
      - terraform-fmt
      - terraform-docs
      - terraform-lint
      - terraform-security
    # this job should only run if there are no new commits caused by terraform-fmt or terraform-docs
    # if terraform-docs is disabled, it should only run if terraform-fmt caused no changes
    # also only run this job if terraform execution is enabled
    if: ${{ always() && !failure() && !cancelled() && inputs.enable_terraform_execution && (needs.terraform-fmt.result == 'skipped' || needs.terraform-fmt.outputs.diff_exists == 'false') && (!inputs.enable_terraform_docs || needs.terraform-docs.result == 'skipped' || needs.terraform-docs.outputs.diff_exists == 'false') }}
    runs-on: ${{ inputs.github_runner }}
    outputs:
      execution_status: ${{ steps.plan.outcome || steps.apply.outcome }}
      execution_type: ${{ steps.set_execution_type.outputs.type }}

    steps:
      - name: Get Private Module Access Token
        if: ${{ inputs.terraform_modules_auth == 'github-app' }}
        id: private_module_access
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.TERRAFORM_MODULES_APP_ID }}
          private-key: ${{ secrets.TERRAFORM_MODULES_APP_PRIVATE_KEY }}
          # If owner is set and repositories is empty, access will be scoped to all repositories in the provided repository owner's installation
          owner: ${{ inputs.terraform_modules_github_owner }}

      - name: Set Private Module Access Token
        if: ${{ inputs.terraform_modules_auth == 'github-app' }}
        run: |
          git config --global url."https://x-access-token:${{ steps.private_module_access.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # Ensure that the checkout action does not persist credentials to not override private module access
          persist-credentials: false

      - name: Setup Terraform
        if: ${{ inputs.use_opentofu == false }}
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false
          cli_config_credentials_hostname: ${{ inputs.terraform_registry_hostname }}
          cli_config_credentials_token: ${{ secrets.TERRAFORM_REGISTRY_TOKEN }}

      - name: Setup OpenTofu
        if: ${{ inputs.use_opentofu == true }}
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: ${{ inputs.terraform_version }}
          tofu_wrapper: false
          cli_config_credentials_hostname: ${{ inputs.terraform_registry_hostname }}
          cli_config_credentials_token: ${{ secrets.TERRAFORM_REGISTRY_TOKEN }}

      - name: Determine Execution Type
        id: set_execution_type
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "type=plan" >> $GITHUB_OUTPUT
            echo "::notice::Will run Terraform Plan for pull request"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/${{ inputs.default_branch }}" ]]; then
            echo "type=apply" >> $GITHUB_OUTPUT
            echo "::notice::Will run Terraform Apply for push to ${{ inputs.default_branch }}"
          else
            echo "type=skip" >> $GITHUB_OUTPUT
            echo "::notice::Skipping Terraform execution - not a PR or push to ${{ inputs.default_branch }}"
          fi

      - name: "Configure AWS credentials"
        if: ${{ inputs.aws_oidc_role_arn != '' }}
        uses: isceco/github-workflows/.github/actions/aws/configure_credentials@v1
        with:
          AWS_ROLE_ARN_TO_ASSUME: ${{ inputs.aws_oidc_role_arn }}
          AWS_REGION: ${{ inputs.aws_default_region }}
          AWS_SESSION_NAME: GitHubActions-${{ github.run_id }}
          AWS_SESSION_DURATION: ${{ inputs.aws_oidc_role_duration_seconds }}

      - name: Setup ECR Authentication for OCI Modules
        if: ${{ inputs.enable_ecr_oci_modules && inputs.ecr_oci_registry_ids != '' && inputs.aws_oidc_role_arn != '' }}
        run: |
          echo "Setting up ECR authentication for OpenTofu/Terraform OCI modules..."

          # Create docker config directory
          mkdir -p ~/.docker

          # Parse comma-separated registry IDs
          IFS=',' read -ra REGISTRY_IDS <<< "${{ inputs.ecr_oci_registry_ids }}"

          # Start building the Docker config JSON
          echo '{"auths":{' > ~/.docker/config.json

          # Configure authentication for each registry
          first=true
          for registry_id in "${REGISTRY_IDS[@]}"; do
            # Trim whitespace
            registry_id=$(echo "$registry_id" | xargs)

            if [ -n "$registry_id" ]; then
              echo "Configuring authentication for ECR registry: $registry_id"

              # Get ECR authorization token
              ECR_TOKEN=$(aws ecr get-login-password --region ${{ inputs.aws_default_region }})
              ECR_REGISTRY="${registry_id}.dkr.ecr.${{ inputs.aws_default_region }}.amazonaws.com"

              # Add comma if not the first entry
              if [ "$first" = false ]; then
                echo ',' >> ~/.docker/config.json
              fi
              first=false

              # Add auth entry for this registry
              echo -n "\"${ECR_REGISTRY}\":{\"auth\":\"$(echo -n "AWS:${ECR_TOKEN}" | base64 -w 0)\"}" >> ~/.docker/config.json
            fi
          done

          # Close the JSON
          echo '}}' >> ~/.docker/config.json

          echo "ECR authentication configured successfully for OCI modules"

      - name: Terraform Init
        if: ${{ steps.set_execution_type.outputs.type != 'skip' }}
        id: init
        run: |
          if [[ "${{ inputs.use_opentofu }}" == "true" ]]; then
            tofu init
          else
            terraform init
          fi
        working-directory: ${{ inputs.terraform_working_directory }}

      - name: Terraform Plan
        if: ${{ steps.set_execution_type.outputs.type == 'plan' }}
        id: plan
        run: |
          if [[ "${{ inputs.use_opentofu }}" == "true" ]]; then
            tofu plan -no-color -input=false
          else
            terraform plan -no-color -input=false
          fi
        working-directory: ${{ inputs.terraform_working_directory }}
        continue-on-error: true

      - name: Terraform Plan Summary
        if: ${{ steps.set_execution_type.outputs.type == 'plan' }}
        run: |
          echo '### TERRAFORM PLAN SUMMARY :memo:' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '**Status:** `${{ steps.plan.outcome }}`' >> $GITHUB_STEP_SUMMARY
          echo '**Triggered by:** @${{ github.actor }}' >> $GITHUB_STEP_SUMMARY
          echo '**Action:** `${{ github.event_name }}`' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '<details><summary>Show Plan Output</summary>' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```terraform' >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.plan.outputs.stdout }}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '</details>' >> $GITHUB_STEP_SUMMARY

      - name: Terraform Plan Status
        if: ${{ steps.set_execution_type.outputs.type == 'plan' && steps.plan.outcome == 'failure' }}
        run: exit 1

      - name: Terraform Apply
        if: ${{ steps.set_execution_type.outputs.type == 'apply' }}
        id: apply
        run: |
          if [[ "${{ inputs.use_opentofu }}" == "true" ]]; then
            tofu apply -auto-approve -no-color -input=false
          else
            terraform apply -auto-approve -no-color -input=false
          fi
        working-directory: ${{ inputs.terraform_working_directory }}

      - name: Terraform Apply Summary
        if: ${{ steps.set_execution_type.outputs.type == 'apply' }}
        run: |
          echo '### TERRAFORM APPLY SUMMARY :rocket:' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '**Status:** `${{ steps.apply.outcome }}`' >> $GITHUB_STEP_SUMMARY
          echo '**Triggered by:** @${{ github.actor }}' >> $GITHUB_STEP_SUMMARY
          echo '**Action:** `${{ github.event_name }}`' >> $GITHUB_STEP_SUMMARY
          echo '**Branch:** `${{ github.ref }}`' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '<details><summary>Show Apply Output</summary>' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```terraform' >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.apply.outputs.stdout }}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '</details>' >> $GITHUB_STEP_SUMMARY

  workflow-summary:
    needs:
      - terraform-fmt
      - terraform-docs
      - terraform-lint
      - terraform-security
      - terraform-execution
    runs-on: ${{ inputs.github_runner }}
    if: ${{ always() }}

    steps:
      - name: Workflow Summary
        env:
          TERRAFORM_VERSION: ${{ inputs.terraform_version }}
          TF_FMT_RESULT: ${{ needs.terraform-fmt.result == 'skipped' && ':heavy_minus_sign:' || needs.terraform-fmt.outputs.fmt_status == 'success' && ':white_check_mark:' || ':x:' }}
          TF_DOCS_RESULT: ${{ needs.terraform-docs.result == 'skipped' && ':heavy_minus_sign:' || needs.terraform-docs.outputs.docs_status == 'success' && ':white_check_mark:' || ':x:' }}
          TF_LINT_RESULT: ${{ needs.terraform-lint.result == 'skipped' && ':heavy_minus_sign:' || needs.terraform-lint.outputs.lint_status == 'success' && ':white_check_mark:' || ':x:' }}
          TF_SECURITY_RESULT: ${{ needs.terraform-security.result == 'skipped' && ':heavy_minus_sign:' || needs.terraform-security.outputs.security_status == 'success' && ':white_check_mark:' || ':x:' }}
          TF_EXECUTION_RESULT: ${{ needs.terraform-execution.result == 'skipped' && ':heavy_minus_sign:' || needs.terraform-execution.outputs.execution_status == 'success' && ':white_check_mark:' || ':x:' }}
          TF_EXECUTION_TYPE: ${{ needs.terraform-execution.outputs.execution_type }}
        run: |
          echo '### WORKFLOW SUMMARY :octocat:' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '| result | job |' >> $GITHUB_STEP_SUMMARY
          echo '|---|---|' >> $GITHUB_STEP_SUMMARY
          echo '| ${{ env.TF_FMT_RESULT }} | terraform format |' >> $GITHUB_STEP_SUMMARY
          echo '| ${{ env.TF_DOCS_RESULT }} | terraform docs |' >> $GITHUB_STEP_SUMMARY
          echo '| ${{ env.TF_LINT_RESULT }} | terraform lint |' >> $GITHUB_STEP_SUMMARY
          echo '| ${{ env.TF_SECURITY_RESULT }} | terraform security |' >> $GITHUB_STEP_SUMMARY
          if [[ "${{ inputs.enable_terraform_execution }}" == "true" && "${{ env.TF_EXECUTION_TYPE }}" != "skip" ]]; then
            echo '| ${{ env.TF_EXECUTION_RESULT }} | terraform ${{ env.TF_EXECUTION_TYPE }} |' >> $GITHUB_STEP_SUMMARY
          fi
