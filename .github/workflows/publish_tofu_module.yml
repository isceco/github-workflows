name: PUBLISH TOFU MODULE
# Reusable workflow: package an OpenTofu module and publish it to a central ECR
# registry as an OCI artifact, so consumers can reference it as
#   source = "oci://<registry>/<namespace>/<module>?tag=<version>"
# instead of pulling from git. Requires OpenTofu 1.10+ on the consumer side.
#
# Nothing about the target account is configured here. The registry URI is derived at
# run time from the account the OIDC role belongs to (via amazon-ecr-login), so the
# AWS_ROLE_ARN secret is the only place an account identifier appears.
#
# Registry repositories are expected to be IMMUTABLE, so republishing an existing
# version is skipped rather than attempted (see the skip_if_exists input).

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to publish, e.g. v1.2.3. Must be an existing git tag in the calling repository. Leave empty when preview is true, which derives its own tag.'
        default: ''
        required: false
        type: string
      preview:
        description: 'Publish a pull request preview instead of a release. Tags the artifact pr-<number>-<short sha>, packages the pull request head rather than a git tag, and comments the reference on the pull request. Previews are excluded from the module catalog and expire on their own.'
        default: false
        required: false
        type: boolean
      preview_expire_days:
        description: 'Days after which a preview is removed by the registry lifecycle policy. Used only to tell people in the pull request comment when the artifact disappears; the actual expiry is enforced by the lifecycle policy on the registry.'
        default: 14
        required: false
        type: number
      module_name:
        description: 'Module name, used as the ECR repository name within the namespace. Defaults to the calling repository name.'
        default: ''
        required: false
        type: string
      aws_region:
        description: 'AWS region of the target ECR registry'
        default: 'eu-central-2'
        required: false
        type: string
      ecr_namespace:
        description: 'Namespace prefix the module repositories live under in the registry'
        default: 'central-registry'
        required: false
        type: string
      artifact_type:
        description: 'OCI artifact type recorded on the pushed manifest'
        default: 'application/vnd.opentofu.modulepkg'
        required: false
        type: string
      oras_version:
        description: 'Version of the ORAS CLI used to push the artifact'
        default: '1.2.2'
        required: false
        type: string
      skip_if_exists:
        description: 'Skip publishing if this version already exists in the registry. Registry repositories are IMMUTABLE, so a re-run would otherwise fail the job.'
        default: true
        required: false
        type: boolean
      docs_repository:
        description: 'Repository name (without owner) to notify after a successful publish, so its module catalog refreshes immediately. Empty disables the notification; the catalog still refreshes on its own schedule. Requires dispatch_app_id and the DOCS_DISPATCH_APP_PRIVATE_KEY secret.'
        default: ''
        required: false
        type: string
      dispatch_app_id:
        description: 'App id of a GitHub App with contents:write on docs_repository, used to send the refresh notification. Install that app on the documentation repository only.'
        default: ''
        required: false
        type: string
      runner:
        description: 'Runner to publish from'
        default: 'ubuntu-latest'
        required: false
        type: string
    secrets:
      AWS_ROLE_ARN:
        description: 'OIDC role ARN to assume for publishing. Also determines the target account, and therefore the registry URI.'
        required: true
      DOCS_DISPATCH_APP_PRIVATE_KEY:
        description: 'Private key of the app identified by dispatch_app_id. Optional; without it the documentation notification is skipped.'
        required: false
    outputs:
      artifact_uri:
        description: 'Full OCI URI of the published artifact'
        value: ${{ jobs.publish.outputs.artifact_uri }}
      skipped:
        description: 'true if publishing was skipped because the version already existed'
        value: ${{ jobs.publish.outputs.skipped }}

permissions:
  id-token: write
  contents: read
  # only used when preview is true, to post the reference on the pull request
  pull-requests: write

jobs:
  publish:
    name: Package and Publish
    runs-on: ${{ inputs.runner }}
    outputs:
      artifact_uri: ${{ steps.resolve.outputs.artifact_uri }}
      skipped: ${{ steps.check.outputs.skipped }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.preview && github.event.pull_request.head.sha || inputs.version }}

      - name: Configure AWS credentials
        uses: isceco/github-workflows/.github/actions/aws/configure_credentials@v1
        with:
          AWS_ROLE_ARN_TO_ASSUME: ${{ secrets.AWS_ROLE_ARN }}
          AWS_REGION: ${{ inputs.aws_region }}
          AWS_SESSION_NAME: GitHubActions-PublishTofuModule-${{ github.run_id }}

      # Yields the registry URI for the account the role belongs to, which keeps the
      # account identifier out of this workflow and out of the caller's configuration.
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Resolve target
        id: resolve
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          MODULE_NAME="${{ inputs.module_name }}"
          if [ -z "${MODULE_NAME}" ]; then
            MODULE_NAME="${GITHUB_REPOSITORY##*/}"
          fi

          # A preview derives its own tag from the pull request and the head commit. The
          # registry is immutable, so the commit has to be part of the tag: every push to
          # the pull request produces a new artifact rather than replacing the previous one.
          if [ "${{ inputs.preview }}" = "true" ]; then
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            PR_NUMBER="${{ github.event.pull_request.number }}"
            if [ -z "${HEAD_SHA}" ] || [ -z "${PR_NUMBER}" ]; then
              echo "::error::preview is true but this is not a pull request event"
              exit 1
            fi
            VERSION="pr-${PR_NUMBER}-${HEAD_SHA:0:7}"
          else
            VERSION="${{ inputs.version }}"
            if [ -z "${VERSION}" ]; then
              echo "::error::version is required unless preview is true"
              exit 1
            fi
          fi

          ECR_REPOSITORY="${{ inputs.ecr_namespace }}/${MODULE_NAME}"
          ARTIFACT_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${VERSION}"
          {
            echo "module_name=${MODULE_NAME}"
            echo "ecr_repository=${ECR_REPOSITORY}"
            echo "artifact_uri=${ARTIFACT_URI}"
            echo "module_source=oci://${ECR_REGISTRY}/${ECR_REPOSITORY}?tag=${VERSION}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing ${MODULE_NAME} ${VERSION} to ${ECR_REPOSITORY}"

      - name: Check whether this version already exists
        id: check
        run: |
          if [ "${{ inputs.skip_if_exists }}" = "true" ] && \
             aws ecr describe-images \
               --repository-name "${{ steps.resolve.outputs.ecr_repository }}" \
               --image-ids imageTag="${{ steps.resolve.outputs.version }}" \
               --region "${{ inputs.aws_region }}" > /dev/null 2>&1; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.resolve.outputs.artifact_uri }} already exists - skipping publish"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ORAS
        if: steps.check.outputs.skipped != 'true'
        run: |
          curl -sSLf -o /tmp/oras.tar.gz \
            "https://github.com/oras-project/oras/releases/download/v${{ inputs.oras_version }}/oras_${{ inputs.oras_version }}_linux_amd64.tar.gz"
          sudo tar -xzf /tmp/oras.tar.gz -C /usr/local/bin oras
          sudo chmod +x /usr/local/bin/oras
          rm -f /tmp/oras.tar.gz
          oras version

      - name: Package module
        if: steps.check.outputs.skipped != 'true'
        env:
          MODULE_NAME: ${{ steps.resolve.outputs.module_name }}
          ECR_REPOSITORY: ${{ steps.resolve.outputs.ecr_repository }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          rm -rf /tmp/module-package /tmp/module.zip
          mkdir -p /tmp/module-package
          rsync -a \
            --exclude='.git' \
            --exclude='.gitignore' \
            --exclude='.terraform' \
            --exclude='*.tfstate*' \
            --exclude='.terraform.lock.hcl' \
            --exclude='terraform.tfvars*' \
            --exclude='*.auto.tfvars*' \
            --exclude='.DS_Store' \
            ./ /tmp/module-package/
          cat > /tmp/module-package/metadata.json << METADATA
          {
            "name": "${MODULE_NAME}",
            "version": "${VERSION}",
            "packaged_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "packaged_by": "GitHub Actions",
            "tool": "OpenTofu Module Packager (CI/CD)",
            "git_commit": "${GITHUB_SHA}",
            "repository": "${ECR_REPOSITORY}"
          }
          METADATA
          (cd /tmp/module-package && zip -r /tmp/module.zip . -q)
          echo "Archive size: $(du -h /tmp/module.zip | cut -f1)"

      - name: Publish OCI artifact
        if: steps.check.outputs.skipped != 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ARTIFACT_URI: ${{ steps.resolve.outputs.artifact_uri }}
          MODULE_NAME: ${{ steps.resolve.outputs.module_name }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          aws ecr get-login-password --region "${{ inputs.aws_region }}" \
            | oras login "${ECR_REGISTRY}" --username AWS --password-stdin
          oras push "${ARTIFACT_URI}" \
            --disable-path-validation \
            --artifact-type "${{ inputs.artifact_type }}" \
            /tmp/module.zip:archive/zip \
            --annotation "org.opencontainers.image.title=${MODULE_NAME}" \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            --annotation "org.opencontainers.image.created=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --annotation "org.opencontainers.image.description=OpenTofu module: ${MODULE_NAME}" \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}"

      # A repository's GITHUB_TOKEN is scoped to that repository and cannot dispatch to
      # another one, so this needs an app token. The app is expected to be installed on the
      # documentation repository alone: its private key is distributed to every module
      # repository, and the installation scope is what limits the damage if one of them is
      # compromised.
      - name: Mint docs dispatch token
        id: dispatch_token
        if: ${{ !inputs.preview && inputs.docs_repository != '' && steps.check.outputs.skipped != 'true' }}
        # the artifact is already published by this point; a documentation refresh that
        # cannot authenticate must not turn a successful publish into a failed one
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ inputs.dispatch_app_id }}
          private-key: ${{ secrets.DOCS_DISPATCH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.docs_repository }}

      # Best effort: a documentation refresh that does not fire is not a reason to fail a
      # publish that already succeeded, and the catalog refreshes on its own schedule too.
      - name: Notify documentation repository
        if: ${{ !inputs.preview && inputs.docs_repository != '' && steps.check.outputs.skipped != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.dispatch_token.outputs.token }}
          DOCS_REPO: ${{ inputs.docs_repository }}
          MODULE_NAME: ${{ steps.resolve.outputs.module_name }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::no dispatch token available, skipping documentation refresh"
            exit 0
          fi
          gh api -X POST "/repos/${GITHUB_REPOSITORY_OWNER}/${DOCS_REPO}/dispatches" \
            -f "event_type=module-published" \
            -F "client_payload[module]=${MODULE_NAME}" \
            -F "client_payload[version]=${VERSION}" \
            && echo "::notice::requested catalog refresh in ${DOCS_REPO}"

      # Posted as a comment rather than only a job summary: a summary is one click away
      # from the pull request and in practice nobody looks. The comment is updated in place
      # on later pushes so the conversation does not fill with one comment per commit.
      - name: Comment the preview reference
        if: ${{ inputs.preview && steps.check.outputs.skipped != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE_SOURCE: ${{ steps.resolve.outputs.module_source }}
          MODULE_NAME: ${{ steps.resolve.outputs.module_name }}
          VERSION: ${{ steps.resolve.outputs.version }}
          EXPIRE_DAYS: ${{ inputs.preview_expire_days }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          MARKER="<!-- tofu-module-preview -->"
          LABEL="${MODULE_NAME#terraform-aws-}"; LABEL="${LABEL%-module}"
          MODULE_LABEL="${LABEL//-/_}"
          EXPIRES=$(date -u -d "+${EXPIRE_DAYS} days" +"%Y-%m-%d" 2>/dev/null \
                    || date -u -v "+${EXPIRE_DAYS}d" +"%Y-%m-%d")
          BODY=$(cat <<EOF
          ${MARKER}
          **Module preview published**

          \`\`\`hcl
          module "${MODULE_LABEL}" {
            source = "${MODULE_SOURCE}"
          }
          \`\`\`

          Built from the head of this pull request. Every push publishes a new tag, because
          the registry is immutable and an existing tag cannot be replaced.

          This artifact is removed around **${EXPIRES}** (${EXPIRE_DAYS} days). Do not
          reference it from anything permanent.
          EOF
          )

          EXISTING=$(gh api "/repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -1)

          if [ -n "${EXISTING}" ]; then
            gh api -X PATCH "/repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING}" \
              -f "body=${BODY}" >/dev/null
            echo "::notice::updated the preview comment on #${PR}"
          else
            gh api -X POST "/repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
              -f "body=${BODY}" >/dev/null
            echo "::notice::commented the preview reference on #${PR}"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## OpenTofu module publish"
            echo ""
            if [ "${{ steps.check.outputs.skipped }}" = "true" ]; then
              echo "Skipped: version already present in the registry."
            else
              echo "Published \`oci://${{ steps.resolve.outputs.artifact_uri }}\`"
              if [ "${{ inputs.preview }}" = "true" ]; then
                echo ""
                echo "Pull request preview, removed after ${{ inputs.preview_expire_days }} days."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
